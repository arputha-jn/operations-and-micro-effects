<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty Characters</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        #card-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: auto;
        }
        .card h3 {
            margin: 10px 0 5px;
            color: #222;
        }
        .card p {
            margin: 0 0 15px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Rick and Morty Characters</h1>
    <div id="card-container">Loading...</div>

    <script>
        // Function to fetch data and render cards asynchronously
        async function fetchCharacters() {
            const container = document.getElementById('card-container');
            
            try {
                // Fetching data from the Rick and Morty API
                const response = await fetch('https://rickandmortyapi.com/api/character');
                const data = await response.json();
                
                // Clear the "Loading..." text
                container.innerHTML = '';

                // Loop through the characters array and build HTML cards
                data.results.forEach(character => {
                    const card = document.createElement('div');
                    card.classList.add('card');

                    card.innerHTML = `
                        <img src="${character.image}" alt="${character.name}">
                        <h3>${character.name}</h3>
                        <p>Status: ${character.status}</p>
                    `;

                    container.appendChild(card);
                });

            } catch (error) {
                container.innerHTML = '<p>Failed to load characters. Please try again later.</p>';
                console.error('Error fetching data:', error);
            }
        }

        // Run the function when the page loads
        fetchCharacters();
    </script>

</body>
</html>
